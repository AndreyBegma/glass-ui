# glass-ui CI (#89).
#
# Lint, test, build and smoke-test the packed tarball on every pull request and
# on every push to develop and main. `release.yml` publishes; this never does.
#
# The repository is not trusted in Woodpecker, so there are no host volumes and
# no caches: a plain node image, with bun installed into it at the version the
# lockfile was written with.

when:
  - event: pull_request
  - event: push
    branch: [develop, main]

variables:
  - &node_image node:24
  - &setup npm install --global --no-fund --no-audit bun@1.4.0

steps:
  - name: install
    image: *node_image
    commands:
      - *setup
      - bun install --frozen-lockfile

  - name: lint
    image: *node_image
    commands:
      - *setup
      - bun run lint

  - name: test
    image: *node_image
    commands:
      - *setup
      - bun run test

  # The release decisions (publish or not, which dist-tag) live in
  # scripts/release/decide.sh, outside `bun run test`, which covers src only.
  - name: release-script
    image: *node_image
    commands:
      - *setup
      - bun test scripts/release

  - name: build
    image: *node_image
    commands:
      - *setup
      - bun run build

  - name: smoke
    image: *node_image
    commands:
      - *setup
      - bun run smoke
